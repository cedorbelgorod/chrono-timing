<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Управление соревнованиями</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            margin: 0; background: #f4f6f8; color: #111827;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 16px;
        }
        .card {
            background: #fff; padding: 30px 26px; border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,.08); width: 100%; max-width: 360px;
            border-top: 4px solid #1f2937;
        }
        h1 { margin: 0 0 6px; font-size: 20px; font-weight: 600; text-align: center; }
        .sub { color: #6b7280; font-size: 13px; text-align: center; margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; color: #374151; font-weight: 500; }
        input {
            width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid #d1d5db;
            border-radius: 8px; margin-bottom: 14px; font-family: inherit;
        }
        input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
        button {
            width: 100%; padding: 11px; font-size: 15px; font-weight: 600; border: none;
            border-radius: 8px; background: #1f2937; color: #fff; cursor: pointer; font-family: inherit;
        }
        button:hover { background: #111827; }
        .flash { padding: 9px 12px; border-radius: 8px; margin-bottom: 14px; font-size: 13px; }
        .flash-error { background: #fee2e2; color: #991b1b; }
        .flash-success { background: #dcfce7; color: #166534; }
        .back { display: block; text-align: center; margin-top: 16px; font-size: 13px; color: #6b7280; }
    </style>
</head>
<body>
<div class="card">
    <h1>Управление соревнованиями</h1>
    <div class="sub">Служебный вход</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash flash-{{ 'error' if category == 'error' else 'success' }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="post" action="{{ url_for('manage_login') }}">
        <label for="username">Логин</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus required>
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <button type="submit">Войти</button>
    </form>
    <a class="back" href="{{ url_for('index') }}">← К выбору соревнования</a>
</div>
</body>
</html>
