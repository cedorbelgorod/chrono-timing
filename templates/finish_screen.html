<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Финиш — Хронометраж</title>
    <style>
        * { box-sizing: border-box; }
        html { scrollbar-gutter: stable; }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            margin: 0; background: #111827; color: #f9fafb;
        }
        .fs-header {
            padding: 16px 24px; background: #1f2937;
            display: flex; justify-content: space-between; align-items: center;
        }
        .fs-header h1 { margin: 0; font-size: 24px; }
        .fs-container { padding: 16px 24px; }
        .fs-heat-title { font-size: 28px; font-weight: 700; margin-bottom: 16px; }
        /* одинаковая сетка колонок во всех таблицах категорий */
        .fs-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .fs-table .col-num    { width: 9%; }
        .fs-table .col-name   { width: 41%; }
        .fs-table .col-laps   { width: 12%; }
        .fs-table .col-result { width: 20%; }
        .fs-table .col-gap    { width: 18%; }
        .fs-table th, .fs-table td {
            padding: 12px 16px; text-align: left;
            border-bottom: 1px solid #374151; font-size: 20px;
            overflow: hidden; text-overflow: ellipsis;
        }
        .fs-table th {
            background: #1f2937; color: #9ca3af;
            font-size: 14px; text-transform: uppercase;
        }
        .fs-num  { font-weight: 800; white-space: nowrap; }
        .fs-name { font-weight: 600; }
        .fs-laps { color: #9ca3af; white-space: nowrap; }
        .fs-result { white-space: nowrap; }
        .fs-ok      { color: #4ade80; font-weight: 700; font-size: 24px; }
        .fs-running { color: #fbbf24; }
        .fs-lapped  { color: #fbbf24; }
        .fs-dnf     { color: #f87171; }
        .fs-dns     { color: #6b7280; }
        .fs-gap {
            color: #fbbf24;
            font-family: "SF Mono", Consolas, "Liberation Mono", monospace;
            font-weight: 600; font-size: 18px;
            white-space: nowrap;
        }
        .fs-gap-leader { color: #4ade80; font-weight: 700; font-size: 16px; }
        .fs-gap-laps { color: #fbbf24; }
        .fs-gap-time { color: #fbbf24; }

        .fs-heat-stat { font-size: 16px; color: #9ca3af; font-weight: 500; margin-left: 12px; }
        .fs-cat { margin-bottom: 20px; }
        .fs-cat-name {
            font-size: 18px; font-weight: 700; color: #93c5fd;
            padding: 6px 0 6px; display: flex; align-items: baseline; gap: 10px;
        }
        .fs-cat-count { font-size: 14px; color: #6b7280; font-weight: 500; }
        .fs-row-ok      { background: #052e16; }
        .fs-row-running { background: #1c1917; }
        .fs-empty { text-align: center; padding: 60px; font-size: 24px; color: #6b7280; }

        .fs-head-right { display: flex; align-items: center; gap: 18px; }
        /* фиксируем ширину статуса: иначе от смены текста QR сдвигается */
        #fs-live { display: inline-block; min-width: 170px; text-align: right; }
        .fs-qr { display: flex; align-items: center; gap: 10px; }
        .fs-qr-code { background: #fff; padding: 5px; border-radius: 8px; line-height: 0; }
        .fs-qr-code svg { width: 84px; height: 84px; display: block; }
        .fs-qr span { font-size: 13px; color: #9ca3af; line-height: 1.3; }
        @media (max-width: 700px) {
            .fs-qr { display: none; }
            .fs-header h1 { font-size: 20px; }
        }
    </style>
</head>
<body>
<div class="fs-header">
    <h1>🏁 Финиш{% if competition %} — {{ competition.name }}{% endif %}</h1>
    <div class="fs-head-right">
        {% if qr_svg %}
            <div class="fs-qr" title="{{ public_url }}">
                <div class="fs-qr-code">{{ qr_svg|safe }}</div>
                <span>Текущие<br>результаты</span>
            </div>
        {% endif %}
        <span id="fs-live" style="font-size:14px;color:#4ade80">● автообновление</span>
    </div>
</div>
<div class="fs-container" id="fs-container">
    <div class="fs-empty">Загрузка…</div>
</div>
<script>
(function () {
    const CID = {{ cid or 'null' }};
    const container = document.getElementById('fs-container');
    const indicator = document.getElementById('fs-live');
    let isFetching = false;
    let lastHtml = '';

    async function refresh() {
        if (!CID || isFetching) return;
        isFetching = true;
        try {
            const resp = await fetch(`{{ data_url or '/finish-screen/data' }}?cid=${CID}`, { cache: 'no-store' });
            if (resp.ok) {
                const html = (await resp.text()).trim();
                if (html === lastHtml) return;   // данные не изменились — не трогаем разметку
                lastHtml = html;
                container.innerHTML = html;
                if (indicator) {
                    indicator.textContent = '● обновлено';
                    indicator.style.color = '#4ade80';
                    setTimeout(() => {
                        if (indicator) indicator.textContent = '● автообновление';
                    }, 1500);
                }
            }
        } catch (e) {
            if (indicator) {
                indicator.textContent = '⚠ ошибка';
                indicator.style.color = '#f87171';
            }
        } finally {
            isFetching = false;
        }
    }

    refresh();
    setInterval(refresh, 2000);
})();
</script>
</body>
</html>
