<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f59e0b">
    <title>Регистрация недоступна</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; background: #f4f6f8; color: #111827;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 24px 16px;
        }
        .card {
            background: #fff; border-radius: 18px; padding: 30px 24px; text-align: center;
            box-shadow: 0 6px 24px rgba(0,0,0,.08); max-width: 420px; width: 100%;
        }
        .icon { font-size: 46px; line-height: 1; }
        h1 { font-size: 20px; margin: 12px 0 8px; }
        .msg { color: #4b5563; font-size: 15px; line-height: 1.55; }
        .org { margin-top: 20px; font-size: 12px; color: #9ca3af; }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">🔒</div>
    <h1>Регистрация недоступна</h1>
    <div class="msg">{{ message }}</div>
    <div class="org">РОО «Белгородская Региональная Федерация велосипедного спорта»</div>
</div>
</body>
</html>
